services:
  app:
    image: ghcr.io/united/united:0.93.0
    container_name: united-app
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      - UNI_CONTAINER_TYPE=APP
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - united
  worker:
    image: ghcr.io/united/united:0.93.0
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      - UNI_CONTAINER_TYPE=WORKER
    deploy:
      replicas: 5
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - united
  postgres:
    image: 'pgvector/pgvector:0.8.0-pg14'
    container_name: postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - 'POSTGRES_DB=${UNI_POSTGRES_DATABASE}'
      - 'POSTGRES_PASSWORD=${UNI_POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${UNI_POSTGRES_USERNAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - united
  redis:
    image: 'redis:7.0.7'
    container_name: redis
    restart: unless-stopped
    volumes:
      - 'redis_data:/data'
    networks:
      - united
volumes:
  postgres_data:
  redis_data:
networks:
  united:
