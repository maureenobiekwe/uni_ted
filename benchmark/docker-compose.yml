services:
  nginx:
    image: nginx:1.25
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      bench:
        # Static IP so the SANDBOX_PROCESS engine (whose sandbox /etc/resolv.conf points at public
        # DNS 8.8.8.8 and can't resolve the docker-internal "nginx" name) can still reach the server
        # by IP to report flow results. UNI_FRONTEND_URL points here.
        ipv4_address: 172.30.0.10

  app:
    image: united-benchmark:local
    build: .
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    environment:
      UNI_CONTAINER_TYPE: ${UNI_CONTAINER_TYPE:-APP}
      UNI_EDITION: ${UNI_EDITION:-ce}
      UNI_LICENSE_KEY: ${UNI_LICENSE_KEY:-}
      UNI_POSTGRES_DATABASE: united
      UNI_POSTGRES_PASSWORD: password
      UNI_POSTGRES_USERNAME: postgres
      UNI_POSTGRES_HOST: postgres
      UNI_POSTGRES_PORT: 5432
      UNI_JWT_SECRET: benchmark-secret-key-for-testing
      UNI_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      UNI_FRONTEND_URL: http://172.30.0.10:80
      UNI_EXECUTION_MODE: ${UNI_EXECUTION_MODE:-SANDBOX_CODE_ONLY}
      UNI_REDIS_HOST: redis
      UNI_REDIS_PORT: 6379
      UNI_ENVIRONMENT: prod
      UNI_LOG_LEVEL: ${UNI_LOG_LEVEL:-error}
      UNI_TELEMETRY_ENABLED: false
      UNI_PROJECT_RATE_LIMITER_ENABLED: false
      UNI_PIECES_SYNC_MODE: ${UNI_PIECES_SYNC_MODE:-OFFICIAL_AUTO}
      UNI_SANDBOX_MEMORY_LIMIT: ${UNI_SANDBOX_MEMORY_LIMIT:-}
      UNI_DEFAULT_CONCURRENT_JOBS_LIMIT: 1000
      UNI_FILE_STORAGE_LOCATION: ${UNI_FILE_STORAGE_LOCATION:-DB}
      UNI_S3_BUCKET: ${UNI_S3_BUCKET:-}
      UNI_S3_ACCESS_KEY_ID: ${UNI_S3_ACCESS_KEY_ID:-}
      UNI_S3_SECRET_ACCESS_KEY: ${UNI_S3_SECRET_ACCESS_KEY:-}
      UNI_S3_ENDPOINT: ${UNI_S3_ENDPOINT:-}
      UNI_S3_REGION: ${UNI_S3_REGION:-}
      UNI_S3_USE_SIGNED_URLS: ${UNI_S3_USE_SIGNED_URLS:-false}
    deploy:
      replicas: ${APP_REPLICAS:-1}
      resources:
        limits:
          cpus: '2'
          memory: 4G
    networks:
      - bench

  worker:
    image: united-benchmark:local
    depends_on:
      - app
    environment:
      UNI_CONTAINER_TYPE: WORKER
      UNI_FRONTEND_URL: http://172.30.0.10:80
      UNI_JWT_SECRET: benchmark-secret-key-for-testing
      UNI_ENCRYPTION_KEY: 11020ebf480a9b1648ceec6400beaf26
      UNI_EXECUTION_MODE: ${UNI_EXECUTION_MODE:-SANDBOX_CODE_ONLY}
      UNI_REDIS_HOST: redis
      UNI_REDIS_PORT: 6379
      UNI_POSTGRES_DATABASE: united
      UNI_POSTGRES_PASSWORD: password
      UNI_POSTGRES_USERNAME: postgres
      UNI_POSTGRES_HOST: postgres
      UNI_POSTGRES_PORT: 5432
      UNI_LOG_LEVEL: error
      UNI_TELEMETRY_ENABLED: false
      UNI_WORKER_CONCURRENCY: ${UNI_WORKER_CONCURRENCY:-}
      UNI_FILE_STORAGE_LOCATION: ${UNI_FILE_STORAGE_LOCATION:-DB}
      UNI_S3_BUCKET: ${UNI_S3_BUCKET:-}
      UNI_S3_ACCESS_KEY_ID: ${UNI_S3_ACCESS_KEY_ID:-}
      UNI_S3_SECRET_ACCESS_KEY: ${UNI_S3_SECRET_ACCESS_KEY:-}
      UNI_S3_ENDPOINT: ${UNI_S3_ENDPOINT:-}
      UNI_S3_REGION: ${UNI_S3_REGION:-}
      UNI_S3_USE_SIGNED_URLS: ${UNI_S3_USE_SIGNED_URLS:-false}
    privileged: true
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    networks:
      - bench

  postgres:
    image: postgres:14.4
    environment:
      POSTGRES_DB: united
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bench

  redis:
    image: redis:7.0.7
    networks:
      - bench

volumes:
  postgres_data:

networks:
  bench:
    ipam:
      config:
        - subnet: 172.30.0.0/16
