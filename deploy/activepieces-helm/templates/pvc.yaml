{{- if and .Values.persistence.enabled (ne (include "united.workloadType" .) "statefulset") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "united.fullname" . }}-cache
  labels:
    {{- include "united.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }} 