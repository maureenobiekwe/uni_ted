{{- if eq (include "united.workloadType" .) "statefulset" }}
apiVersion: apps/v1
kind: StatefulSet
{{- else }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- end }}
metadata:
  name: {{ include "united.fullname" . }}
  labels:
    {{- include "united.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if eq (include "united.workloadType" .) "statefulset" }}
  serviceName: {{ include "united.fullname" . }}
  podManagementPolicy: {{ .Values.podManagementPolicy | default "OrderedReady" }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "united.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 8 | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "united.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "united.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "united.fullname" . }}-secrets
            - secretRef:
                name: {{ include "united.fullname" . }}-jwt-secret
          {{- if or .Values.unitedEnvVariables .Values.unitedConfig }}
          env:
            {{- range $key, $value := .Values.unitedConfig }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- $fullname := include "united.fullname" . }}
            {{- $legacyKeys := dict "UNI_ENCRYPTION_KEY" (list (printf "%s-secrets" $fullname) "encryption-key") "UNI_JWT_SECRET" (list (printf "%s-jwt-secret" $fullname) "jwt-secret") }}
            {{- range $secretName, $vars := .Values.unitedEnvVariables }}
            {{- range $vars }}
            {{- $ref := list $secretName . true }}
            {{- with get $legacyKeys . }}
            {{- if hasKey ((lookup "v1" "Secret" $.Release.Namespace $secretName).data | default dict) (index $ref 1) }}
            {{- $ref = list $secretName (index $ref 1) false }}
            {{- else if hasKey ((lookup "v1" "Secret" $.Release.Namespace (index . 0)).data | default dict) (index . 1) }}
            {{- $ref = list (index . 0) (index . 1) false }}
            {{- end }}
            {{- end }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ index $ref 0 | quote }}
                  key: {{ index $ref 1 }}
                  optional: {{ index $ref 2 }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.volumeMounts }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: cache
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or .Values.persistence.enabled .Values.volumes }}
      volumes:
        {{- if and .Values.persistence.enabled (ne (include "united.workloadType" .) "statefulset") }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "united.fullname" . }}-cache
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if eq (include "united.workloadType" .) "statefulset" }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- with include "united.cacheStorageClassName" . }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
  {{- else }}
  strategy:
    blueGreen:
      activeService: {{ include "united.fullname" . }}
      previewService: {{ include "united.fullname" . }}-preview
      autoPromotionEnabled: {{ .Values.rollout.blueGreen.autoPromotionEnabled }}
      scaleDownDelaySeconds: {{ .Values.rollout.blueGreen.scaleDownDelaySeconds }}
  {{- end }}
