apiVersion: v1
kind: Secret
metadata:
  name: {{ include "united.fullname" . }}-secrets
  labels:
    {{- include "united.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: UNI_ENCRYPTION_KEY
    secret-generator.v1.mittwald.de/encoding: hex
    secret-generator.v1.mittwald.de/length: "32"
type: Opaque
data: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "united.fullname" . }}-jwt-secret
  labels:
    {{- include "united.labels" . | nindent 4 }}
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: UNI_JWT_SECRET
    secret-generator.v1.mittwald.de/length: "64"
type: Opaque
data: {} 