# Default values for united.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/united/united
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Container configuration
container:
  port: 80

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

rollout:
  blueGreen:
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30

persistence:
  enabled: true
  size: 2Gi
  mountPath: "/usr/src/app/cache"
  # Leave empty to use the cluster's default StorageClass.
  storageClassName: ""

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ============================================================================
# Bitnami PostgreSQL subchart (optional)
# Set enabled=true to deploy a bundled PostgreSQL instance.
# When enabled, add these vars to unitedEnvVariables and ensure they
# are present in united-secrets:
#   UNI_DB_TYPE=POSTGRES
#   UNI_POSTGRES_HOST=<release-name>-postgresql
#   UNI_POSTGRES_PORT=5432
#   UNI_POSTGRES_DATABASE=united
#   UNI_POSTGRES_USERNAME=postgres
#   UNI_POSTGRES_PASSWORD=<auto-generated or set auth.password below>
# Full subchart options: https://artifacthub.io/packages/helm/bitnami/postgresql
# ============================================================================
postgresql:
  enabled: false
  image:
    repository: bitnamilegacy/postgresql
  # auth:
  #   database: united
  #   username: postgres
  #   password: ""        # leave empty to auto-generate
  # primary:
  #   persistence:
  #     enabled: true
  #     size: 8Gi

# ============================================================================
# Bitnami Redis subchart (optional)
# Set enabled=true to deploy a bundled Redis instance.
# When enabled, add these vars to unitedEnvVariables and ensure they
# are present in united-secrets:
#   UNI_REDIS_TYPE=DEFAULT
#   UNI_REDIS_HOST=<release-name>-redis-master
#   UNI_REDIS_PORT=6379
#   UNI_REDIS_PASSWORD=<auto-generated or set auth.password below>
# Full subchart options: https://artifacthub.io/packages/helm/bitnami/redis
# ============================================================================
redis:
  enabled: false
  image:
    repository: bitnamilegacy/redis
  # auth:
  #   enabled: true
  #   password: ""        # leave empty to auto-generate
  # master:
  #   persistence:
  #     enabled: true
  #     size: 4Gi

# Deployment-specific, non-sensitive env vars set as plain values.
# Use this for vars that differ per release (e.g. APP vs WORKER) and don't belong in the shared secret.
unitedConfig: {}

# Map of Kubernetes secret name → list of AP_* (and OTEL_*) env var names to inject.
# Each var name must exist as a key in the corresponding secret.
unitedEnvVariables:
  united-config-secrets:
    - UNI_EDITION
    - UNI_EXECUTION_MODE
    - UNI_ENVIRONMENT
    - UNI_FRONTEND_URL
    - UNI_ENABLE_FLOW_ON_PUBLISH
    - UNI_CLIENT_REAL_IP_HEADER
    - UNI_DB_TYPE
    - UNI_ENGINE_EXECUTABLE_PATH
    - UNI_PLATFORM_ID_FOR_DEDICATED_WORKER
    - UNI_PIECES_SYNC_MODE
    - UNI_PIECES_SOURCE
  united-auth-secrets:
    - UNI_ENCRYPTION_KEY
    - UNI_JWT_SECRET
    - UNI_API_KEY
    - UNI_WORKER_TOKEN
    - UNI_GOOGLE_CLIENT_ID
    - UNI_GOOGLE_CLIENT_SECRET
    - UNI_FIREBASE_HASH_PARAMETERS
  united-queue-secrets:
    - UNI_QUEUE_UI_ENABLED
    - UNI_QUEUE_UI_USERNAME
    - UNI_QUEUE_UI_PASSWORD
  united-log-secrets:
    - UNI_LOG_LEVEL
    - UNI_LOG_PRETTY
    - UNI_SENTRY_DSN
    - UNI_HYPERDX_TOKEN
  united-telemetry-secrets:
    - UNI_TELEMETRY_ENABLED
    - UNI_OTEL_ENABLED
    - UNI_FEATUREBASE_API_KEY
  united-limits-secrets:
    - UNI_DEFAULT_CONCURRENT_JOBS_LIMIT
    - UNI_PROJECT_RATE_LIMITER_ENABLED
    - UNI_API_RATE_LIMIT_AUTHN_ENABLED
    - UNI_MAX_FILE_SIZE_MB
    - UNI_MAX_FLOW_RUN_LOG_SIZE_MB
    - UNI_EXECUTION_DATA_RETENTION_DAYS
    - UNI_WEBHOOK_TIMEOUT_SECONDS
  united-cloudflare-secrets:
    - UNI_CLOUDFLARE_API_BASE
    - UNI_CLOUDFLARE_ZONE_ID
    - UNI_CLOUDFLARE_API_TOKEN
  united-integrations-secrets:
    - UNI_APP_WEBHOOK_SECRETS
    - UNI_SECRET_MANAGER_API_KEY
    - UNI_OPENROUTER_PROVISION_KEY
    - UNI_TEMPLATES_API_KEY
    - UNI_TEMPLATE_MANAGER_API_KEY
  united-db-secrets:
    - UNI_POSTGRES_DATABASE
    - UNI_POSTGRES_HOST
    - UNI_POSTGRES_PORT
    - UNI_POSTGRES_PASSWORD
    - UNI_POSTGRES_USERNAME
    - UNI_POSTGRES_USE_SSL
    - UNI_POSTGRES_POOL_SIZE
    - UNI_POSTGRES_SSL_CA
  united-redis-secrets:
    - UNI_REDIS_TYPE
    - UNI_REDIS_HOST
    - UNI_REDIS_PORT
    - UNI_REDIS_PASSWORD
    - UNI_REDIS_USE_SSL
    - UNI_REDIS_USER
  united-s3-secrets:
    - UNI_FILE_STORAGE_LOCATION
    - UNI_S3_BUCKET
    - UNI_S3_REGION
    - UNI_S3_ENDPOINT
    - UNI_S3_USE_SIGNED_URLS
    - UNI_S3_ACCESS_KEY_ID
    - UNI_S3_SECRET_ACCESS_KEY
  united-smtp-secrets:
    - UNI_SMTP_HOST
    - UNI_SMTP_PORT
    - UNI_SMTP_USERNAME
    - UNI_SMTP_PASSWORD
    - UNI_SMTP_SENDER_EMAIL
    - UNI_SMTP_SENDER_NAME
  united-stripe-secrets:
    - UNI_STRIPE_SECRET_KEY
    - UNI_STRIPE_WEBHOOK_SECRET
  united-otel-secrets:
    - OTEL_EXPORTER_OTLP_ENDPOINT
    - OTEL_EXPORTER_OTLP_HEADERS
